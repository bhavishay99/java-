<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Simple Table and Form</title>
</head>
<body>

    <h2>Student Data Table</h2>
    <table="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Rahul</td>
            <td>Web Dev</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Aman</td>
            <td>AI Course</td>
        </tr>
    </table>

    <hr>

    <h2>Simple Form</h2>
    <form>
        Name: <input type="text" placeholder="Enter name"><br><br>
        Email: <input type="email" placeholder="Enter email"><br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
